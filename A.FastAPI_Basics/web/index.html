<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Registry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">

    <!-- Header -->
    <header class="topbar">
      <div class="brand">
        <h1>Student <em>Registry</em></h1>
        <p>A front desk for your FastAPI student records.</p>
      </div>
      <div class="conn">
        <div class="conn-field" title="Base URL of your FastAPI server">
          <span class="dot" id="connDot"></span>
          <label for="apiBase" class="sr-only">API base URL</label>
          <input id="apiBase" spellcheck="false" autocomplete="off" />
          <button class="icon-btn" id="reconnect" title="Reconnect" aria-label="Reconnect">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
          </button>
        </div>
        <span class="conn-status" id="connStatus">Connecting…</span>
        <button class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
      </div>
    </header>

    <!-- Stats -->
    <section class="stats" aria-label="Summary">
      <div class="stat">
        <div class="stat-label">Students</div>
        <div class="stat-value" id="statTotal">—</div>
        <div class="stat-sub" id="statCourses">&nbsp;</div>
      </div>
      <div class="stat">
        <div class="stat-label">Average marks</div>
        <div class="stat-value" id="statAvg">—</div>
        <div class="stat-sub" id="statAge">&nbsp;</div>
      </div>
      <div class="stat">
        <div class="stat-label">Top scorer</div>
        <div class="stat-value" id="statTop">—</div>
        <div class="stat-sub" id="statTopSub">&nbsp;</div>
      </div>
      <div class="stat">
        <div class="stat-label">Grade spread</div>
        <div class="spread" id="spread"></div>
        <div class="spread-legend" id="spreadLegend"></div>
      </div>
    </section>

    <!-- Toolbar -->
    <section class="toolbar" aria-label="Query controls">
      <div class="control">
        <label for="courseFilter">Course</label>
        <select id="courseFilter"><option value="">All courses</option></select>
      </div>
      <div class="control">
        <label for="sortBy">Sort</label>
        <select id="sortBy">
          <option value="">Default</option>
          <option value="marks">Marks</option>
          <option value="name">Name</option>
          <option value="age">Age</option>
        </select>
      </div>
      <div class="seg" role="group" aria-label="Sort order">
        <button data-order="asc" aria-pressed="true">Asc</button>
        <button data-order="desc" aria-pressed="false">Desc</button>
      </div>
      <form class="control" id="lookupForm" role="search">
        <label for="lookupId">Find</label>
        <input id="lookupId" placeholder="S001" autocomplete="off" spellcheck="false" />
      </form>
      <div class="spacer"></div>
      <button class="btn primary" id="newBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New student
      </button>
    </section>

    <!-- Last request -->
    <div class="reqline" id="reqline" aria-live="polite">
      <span class="muted">No requests yet</span>
    </div>

    <!-- Table -->
    <section class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Course</th>
              <th class="num">Age</th>
              <th class="num">Marks</th>
              <th>Grade</th>
              <th>Email</th>
              <th><span class="sr-only">Actions</span></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="pager" id="pager">
        <div class="group">
          <label for="pageSize">Rows</label>
          <select id="pageSize">
            <option>5</option>
            <option selected>10</option>
            <option>20</option>
            <option>50</option>
          </select>
          <span id="pageInfo"></span>
        </div>
        <div class="group">
          <button class="btn" id="prevPage">← Prev</button>
          <button class="btn" id="nextPage">Next →</button>
        </div>
      </div>
    </section>
  </div>

  <!-- Drawer -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawerTitle">
    <div class="drawer-head">
      <div>
        <div class="eyebrow" id="drawerEyebrow"></div>
        <h2 id="drawerTitle"></h2>
      </div>
      <button class="icon-btn" id="closeDrawer" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-foot" id="drawerFoot"></div>
  </aside>

  <!-- Delete confirm -->
  <dialog id="confirmDialog">
    <div class="dialog-body">
      <h3>Delete student?</h3>
      <p id="confirmText"></p>
    </div>
    <div class="dialog-foot">
      <button class="btn" value="cancel" id="confirmCancel">Cancel</button>
      <button class="btn danger" id="confirmOk">Delete</button>
    </div>
  </dialog>

  <div class="toasts" id="toasts" aria-live="assertive"></div>

  <script src="app.js"></script>
</body>
</html>
